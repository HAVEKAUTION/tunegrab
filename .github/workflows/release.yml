name: Release

# Push a tag like v0.6.0 to publish: runs CI, then attaches the app zip, SHA256SUMS and
# install.ps1 to a GitHub release. install.ps1 checks the zip against SHA256SUMS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its files
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build the zip and its checksum
        run: |
          tag="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="tunegrab-${tag}/" -o "tunegrab-${tag}.zip" "${tag}"
          sha256sum "tunegrab-${tag}.zip" > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="$(awk -v v="${tag#v}" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md)"
          gh release create "${tag}" "tunegrab-${tag}.zip" SHA256SUMS install.ps1 \
            --title "TuneGrab ${tag#v}" --notes "${notes:-See CHANGELOG.md}" \
            $([[ "${tag}" == *-* ]] && echo --prerelease)

  pypi:
    # Trusted publishing: PyPI trusts this workflow + the "pypi" environment, so no
    # token is stored in the repo. Set up once at pypi.org (Publishing -> add publisher).
    needs: ci
    if: ${{ !contains(github.ref_name, '-') }}  # pre-releases (v1.2.0-rc1) stay off PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tunegrab/
    permissions:
      id-token: write  # lets PyPI verify this run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - name: Build the wheel and source package
        run: uv build
      - name: Check the version matches the tag
        run: |
          ls dist
          test -f "dist/tunegrab-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1 (v1.14.3)
